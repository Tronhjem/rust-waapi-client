[package]
name = "waapi-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["waapi-client contributors"]
description = "A Rust library for the Wwise Authoring API (WAAPI)"
repository = "https://github.com/Tronhjem/rust-waapi-client"

keywords = ["wwise", "waapi", "audio", "audiokinetic", "game-audio"]
categories = ["api-bindings", "multimedia::audio"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
env_logger = { version = "0.11", default-features = false }
