[package]
name = "wwise-waapi"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Christian Tronhjem <ctronhjem@gmail.com>"]
description = "Async, typed Rust client for the Wwise Authoring API (WAAPI)"
repository = "https://github.com/SpektakelAudio/rust-waapi-client"
readme = "README.md"
documentation = "https://docs.rs/wwise-waapi"

keywords = ["wwise", "waapi", "audio", "audiokinetic", "game-audio"]
categories = ["api-bindings", "multimedia::audio"]
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
env_logger = { version = "0.11", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

