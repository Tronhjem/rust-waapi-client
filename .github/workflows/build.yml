name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Build, Test & Verify Codegen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated bindings are up-to-date
        run: |
          python tools/generate_waapi_uri.py
          python tools/generate_typed_api.py
          git diff --exit-code
      - name: Build examples
        run: cargo build --examples
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and offline roundtrip tests
        run: |
          cargo test --lib
          cargo test --test typed_api_roundtrip
          cargo test --doc
      - name: Rustdoc check
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps
